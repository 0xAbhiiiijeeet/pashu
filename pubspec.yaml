name: pashu_mitra
description: "Pashu Mitra - Animal care consultation platform"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  provider: ^6.1.1
  intl: any
  dio: ^5.7.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  timeago: ^3.7.0
  connectivity_plus: ^6.0.0

  # Firebase & Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.3
  firebase_remote_config: ^5.1.3
  flutter_local_notifications: ^18.0.0

  # Utilities
  scroll_to_index: ^3.0.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.0.7
  
  # Payment
  razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/app_logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo/pashu_mitra_app_logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo/pashu_mitra_app_logo.jpeg"
